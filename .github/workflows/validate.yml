name: Validate delegation scripts
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  windows-arguments:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/windows-arguments.test.mjs
